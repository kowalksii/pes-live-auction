{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-4">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h3 class="text-center mb-4">

                    Login

                </h3>

                <form method="post">

                    {% csrf_token %}

                    {% for field in form %}

                        <div class="mb-3">

                            <label class="form-label">

                                {{ field.label }}

                            </label>

                            {{ field }}

                            {% if field.errors %}

                                <div class="text-danger small mt-1">

                                    {{ field.errors }}

                                </div>

                            {% endif %}

                        </div>

                    {% endfor %}

                    <button
                        class="btn btn-primary w-100"
                        type="submit">

                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
