<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'core:home' %}">
            PES Live Auction
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent" aria-controls="navbarContent"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            {% if user.is_authenticated %}
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard:redirect' %}">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'core:tournament_list' %}">
                        Tournaments
                    </a>
                </li>

                {% if request.user.role == "PARTICIPANT" %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard:my_tournaments' %}">
                        My Tournaments
                    </a>
                </li>
                {% endif %}
            </ul>

            <form method="post" action="{% url 'accounts:logout' %}" class="d-flex">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    Logout
                </button>
            </form>

            {% else %}
            <div class="d-flex ms-auto">
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-light me-2">
                    Login
                </a>
                <a href="{% url 'accounts:register' %}" class="btn btn-primary">
                    Register
                </a>
            </div>
            {% endif %}

        </div>

    </div>
</nav>
