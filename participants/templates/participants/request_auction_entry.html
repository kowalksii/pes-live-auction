{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">

                <h4 class="mb-0">

                    Request Auction Entry

                </h4>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        class="btn btn-primary">

                        Send Request

                    </button>

                    <a
                        href="{% url 'core:tournament_detail' tournament.pk %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
