{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="text-center">

        <h1 class="display-4 fw-bold">
            PES Live Auction
        </h1>

        <p class="lead mt-3">
            Professional Real-Time Football Auction Platform
        </p>

        {% if not user.is_authenticated %}

            <div class="mt-4">

                <a
                    href="{% url 'accounts:login' %}"
                    class="btn btn-primary btn-lg me-2">

                    Login

                </a>

                <a
                    href="{% url 'accounts:register' %}"
                    class="btn btn-success btn-lg">

                    Register

                </a>

            </div>

        {% else %}

            <div class="mt-4">

                <a
                    href="{% url 'dashboard:redirect' %}"
                    class="btn btn-success btn-lg">

                    Go to Dashboard

                </a>

            </div>

        {% endif %}

    </div>

</div>

{% endblock %}
