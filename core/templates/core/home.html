{% extends "base.html" %}

{% block content %}

<div class="py-5 text-center">

<h1 class="display-4 fw-bold">

PES Live Auction

</h1>

<p class="lead mt-3">

Professional Real-Time Football Auction Platform

</p>

{% if not user.is_authenticated %}

<a
href="{% url 'accounts:login' %}"
class="btn btn-lg btn-primary mt-4">

Login

</a>

{% else %}

<a
href="{% url 'dashboard:redirect' %}"
class="btn btn-lg btn-success mt-4">

Go to Dashboard

</a>

{% endif %}

</div>

{% endblock %}
